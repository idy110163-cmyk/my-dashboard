<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마케팅 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Pretendard',-apple-system,sans-serif; background:#f8fafc; color:#0f172a; padding:24px; }
  .wrap { max-width:1200px; margin:0 auto; }
  header { margin-bottom:20px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:22px; font-weight:700; }
  header .sub { font-size:13px; color:#64748b; }
  header a { margin-left:auto; font-size:13px; color:#64748b; text-decoration:none; }
  .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:14px; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:18px 20px; }
  .card .label { font-size:13px; color:#64748b; margin-bottom:6px; }
  .card .value { font-size:26px; font-weight:700; letter-spacing:-0.5px; }
  .card .value.big { font-size:32px; color:#ea580c; }
  .card .sub { font-size:12.5px; color:#64748b; margin-top:6px; }
  .card .sub strong { color:#0f172a; }
  .progress { height:8px; background:#fdeee3; border-radius:4px; margin-top:10px; overflow:hidden; }
  .progress > div { height:100%; background:#ea580c; border-radius:4px; }
  .panel { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:20px; margin-bottom:14px; }
  .panel h2 { font-size:15px; font-weight:600; margin-bottom:14px; }
  .panel h2 span { font-size:12px; font-weight:400; color:#94a3b8; margin-left:6px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .grid2 .panel { margin-bottom:0; }
  table.ch { width:100%; border-collapse:collapse; font-size:13px; }
  table.ch th { text-align:right; color:#64748b; font-weight:500; padding:8px 10px; border-bottom:1px solid #e2e8f0; white-space:nowrap; }
  table.ch th:first-child, table.ch td:first-child { text-align:left; }
  table.ch td { text-align:right; padding:9px 10px; border-bottom:1px solid #f1f5f9; white-space:nowrap; }
  table.ch tr.total td { font-weight:700; border-top:2px solid #e2e8f0; border-bottom:none; background:#fafbfc; }
  .roas-cell { display:flex; align-items:center; gap:8px; justify-content:flex-end; }
  .roas-bar { width:64px; height:8px; background:#fdeee3; border-radius:4px; overflow:hidden; }
  .roas-bar > div { height:100%; background:#ea580c; border-radius:4px; }
  .pace-row { margin-bottom:14px; }
  .pace-label { display:flex; justify-content:space-between; font-size:13px; color:#475569; margin-bottom:5px; }
  .pace-track { height:14px; background:#f1f5f9; border-radius:7px; overflow:hidden; }
  .pace-fill { height:100%; border-radius:7px; }
  .pace-msg { font-size:13.5px; margin:14px 0; padding:12px 14px; background:#fff7ed; border-radius:10px; color:#9a3412; line-height:1.5; }
  .pace-stats { display:flex; gap:10px; }
  .pace-stat { flex:1; background:#fafbfc; border:1px solid #eef2f7; border-radius:10px; padding:10px; text-align:center; }
  .pace-stat .l { font-size:12px; color:#64748b; margin-bottom:3px; }
  .pace-stat .v { font-size:16px; font-weight:700; }
  .err { background:#fff; border:1px solid #fca5a5; color:#b91c1c; border-radius:14px; padding:20px; font-size:14px; line-height:1.6; display:none; margin-bottom:14px; white-space:pre-wrap; word-break:break-all; }
  .loading { text-align:center; color:#94a3b8; padding:60px 0; font-size:14px; }
  svg text { font-family:'Pretendard',sans-serif; }
  .tbl-scroll { overflow-x:auto; }
  @media (max-width:860px) {
    body { padding:14px; }
    .cards { grid-template-columns:repeat(2,1fr); }
    .grid2 { grid-template-columns:1fr; }
    .card .value.big { font-size:26px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📣 마케팅 대시보드</h1>
    <span class="sub" id="updated"></span>
    <a href="../">← 전체 대시보드</a>
  </header>

  <div class="err" id="errBox"></div>
  <div class="loading" id="loading">데이터를 불러오는 중…</div>

  <div id="content" style="display:none">
    <div class="cards" id="cards"></div>

    <div class="panel">
      <h2>채널별 성과 <span>금액: 만원</span></h2>
      <div class="tbl-scroll" id="chTable"></div>
    </div>

    <div class="grid2">
      <div class="panel">
        <h2>월별 광고비 & ROAS <span>막대 = 광고비 · 선 = ROAS%</span></h2>
        <div id="comboChart"></div>
      </div>
      <div class="panel">
        <h2>예산 소진 페이싱</h2>
        <div id="pacing"></div>
      </div>
    </div>
  </div>
</div>

<script>
const { createClient } = supabase;
const db = createClient(
  'https://ngqjcxjojskvglburgoc.supabase.co',
  'sb_publishable_DB_a5tbS3nFQtukwe8NqPA_L5ACxV4x'
);
const fmt = n => n.toLocaleString('ko-KR');

async function main() {
  const [c, m, b] = await Promise.all([
    db.from('marketing_channel').select('*').order('spend', { ascending: false }),
    db.from('marketing_monthly').select('*').order('sort_order', { ascending: true }),
    db.from('marketing_budget').select('*')
  ]);
  for (const res of [c, m, b]) if (res.error) throw res.error;
  const ch = c.data, monthly = m.data, budget = b.data[0];
  const cur = monthly[monthly.length - 1];

  // 합계
  const T = ch.reduce((a, x) => ({
    spend: a.spend + x.spend, imp: a.imp + x.impressions, clk: a.clk + x.clicks,
    conv: a.conv + x.conversions, rev: a.rev + x.revenue
  }), { spend: 0, imp: 0, clk: 0, conv: 0, rev: 0 });
  const totalRoas = T.rev / T.spend * 100;
  const cac = T.spend / T.conv;
  const cvr = T.conv / T.clk * 100;
  const spendRate = cur.spend / budget.budget * 100;

  // ---- 카드 ----
  document.getElementById('cards').innerHTML = `
    <div class="card">
      <div class="label">이번 달 광고비 (${cur.month})</div>
      <div class="value big">${fmt(cur.spend)}<span style="font-size:16px">만원</span></div>
      <div class="progress"><div style="width:${Math.min(spendRate,100)}%"></div></div>
      <div class="sub">예산 ${fmt(budget.budget)}만원 중 <strong>${spendRate.toFixed(1)}%</strong> 소진</div>
    </div>
    <div class="card">
      <div class="label">통합 ROAS</div>
      <div class="value">${totalRoas.toFixed(0)}<span style="font-size:15px">%</span></div>
      <div class="sub">광고비 1만원당 매출 <strong>${(totalRoas/100).toFixed(1)}만원</strong></div>
    </div>
    <div class="card">
      <div class="label">CAC (고객 획득 비용)</div>
      <div class="value">${cac.toFixed(1)}<span style="font-size:15px">만원</span></div>
      <div class="sub">광고비 ÷ 전환 ${fmt(T.conv)}건</div>
    </div>
    <div class="card">
      <div class="label">전환수</div>
      <div class="value">${fmt(T.conv)}<span style="font-size:15px">건</span></div>
      <div class="sub">CVR (클릭→전환) <strong>${cvr.toFixed(2)}%</strong></div>
    </div>`;

  // ---- 채널 표 ----
  const row = x => {
    const ctr = x.clicks / x.impressions * 100, cpc = x.spend / x.clicks * 10000,
          cpa = x.spend / x.conversions, roas = x.revenue / x.spend * 100;
    return `<tr>
      <td>${x.channel}</td><td>${fmt(x.spend)}</td><td>${fmt(x.impressions)}</td>
      <td>${fmt(x.clicks)}</td><td>${ctr.toFixed(2)}%</td><td>${fmt(Math.round(cpc))}원</td>
      <td>${fmt(x.conversions)}</td><td>${cpa.toFixed(1)}만</td>
      <td><div class="roas-cell"><div class="roas-bar"><div style="width:${Math.min(roas/700*100,100)}%"></div></div><b>${roas.toFixed(0)}%</b></div></td>
    </tr>`;
  };
  document.getElementById('chTable').innerHTML = `
    <table class="ch">
      <tr><th>채널</th><th>광고비</th><th>노출</th><th>클릭</th><th>CTR</th><th>CPC</th><th>전환</th><th>CPA</th><th>ROAS</th></tr>
      ${ch.map(row).join('')}
      <tr class="total">
        <td>합계·평균</td><td>${fmt(T.spend)}</td><td>${fmt(T.imp)}</td><td>${fmt(T.clk)}</td>
        <td>${(T.clk/T.imp*100).toFixed(2)}%</td><td>${fmt(Math.round(T.spend/T.clk*10000))}원</td>
        <td>${fmt(T.conv)}</td><td>${cac.toFixed(1)}만</td>
        <td><div class="roas-cell"><div class="roas-bar"><div style="width:${Math.min(totalRoas/700*100,100)}%"></div></div><b>${totalRoas.toFixed(0)}%</b></div></td>
      </tr>
    </table>`;

  // ---- 광고비 막대 + ROAS 선 ----
  const W = 520, H = 240, padL = 44, padB = 28, padT = 24;
  const cw = W - padL - 14, chH = H - padT - padB;
  const maxS = Math.max(...monthly.map(d => d.spend)) * 1.2;
  const roasVals = monthly.map(d => Number(d.roas));
  const rMin = Math.min(...roasVals) - 30, rMax = Math.max(...roasVals) + 30;
  const bw = cw / monthly.length * 0.5;
  let bars = '', xlab = '', pts = [];
  monthly.forEach((d, i) => {
    const cx = padL + cw / monthly.length * (i + 0.5);
    const h = d.spend / maxS * chH, y = padT + chH - h;
    const isCur = i === monthly.length - 1;
    bars += `<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${isCur?'#ea580c':'#f8c9a8'}"/>`;
    xlab += `<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="12" fill="${isCur?'#0f172a':'#64748b'}" font-weight="${isCur?600:400}">${d.month}</text>`;
    pts.push([cx, padT + chH - ((d.roas - rMin) / (rMax - rMin) * chH), d.roas]);
  });
  const line = pts.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join(' ');
  const dots = pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#7c2d12" stroke="#fff" stroke-width="2"/>
    <text x="${p[0]}" y="${p[1]-9}" text-anchor="middle" font-size="10.5" fill="#7c2d12" font-weight="600">${p[2]}%</text>`).join('');
  document.getElementById('comboChart').innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
      ${bars}<path d="${line}" fill="none" stroke="#7c2d12" stroke-width="2"/>${dots}${xlab}
    </svg>`;

  // ---- 페이싱 ----
  const elapsed = budget.days_passed / budget.days_total * 100;
  const diff = spendRate - elapsed;
  const daily = cur.spend / budget.days_passed;
  const runout = Math.floor(budget.budget / daily);
  const remainBudget = budget.budget - cur.spend;
  const runoutMsg = runout >= budget.days_total
    ? `이 속도면 예산 안에서 월말까지 집행 가능합니다.`
    : `이 속도면 <b>${runout}일째</b>에 예산이 바닥납니다. (이번 달 ${budget.days_total}일)`;
  document.getElementById('pacing').innerHTML = `
    <div class="pace-row">
      <div class="pace-label"><span>예산 소진</span><b>${spendRate.toFixed(1)}%</b></div>
      <div class="pace-track"><div class="pace-fill" style="width:${Math.min(spendRate,100)}%;background:#ea580c"></div></div>
    </div>
    <div class="pace-row">
      <div class="pace-label"><span>기간 경과 (${budget.days_passed}/${budget.days_total}일)</span><b>${elapsed.toFixed(1)}%</b></div>
      <div class="pace-track"><div class="pace-fill" style="width:${elapsed}%;background:#94a3b8"></div></div>
    </div>
    <div class="pace-msg">기간 경과보다 <b>${Math.abs(diff).toFixed(1)}%p ${diff >= 0 ? '빠르게' : '느리게'}</b> 소진 중 · ${runoutMsg}</div>
    <div class="pace-stats">
      <div class="pace-stat"><div class="l">집행</div><div class="v">${fmt(cur.spend)}만</div></div>
      <div class="pace-stat"><div class="l">잔여</div><div class="v">${fmt(remainBudget)}만</div></div>
      <div class="pace-stat"><div class="l">일 평균</div><div class="v">${daily.toFixed(1)}만</div></div>
    </div>`;

  document.getElementById('updated').textContent =
    new Date().toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' }) + ' 기준';
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}
main().catch(e => {
  document.getElementById('loading').style.display = 'none';
  const box = document.getElementById('errBox');
  box.style.display = 'block';
  box.textContent = '데이터를 불러오지 못했습니다.\n\n오류 내용: ' + (e.message || JSON.stringify(e)) +
    '\n\n이 화면을 그대로 캡처해서 Claude에게 보여주세요.';
});
</script>
</body>
</html>
