<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영업 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family:'Pretendard',-apple-system,sans-serif; background:#f8fafc; color:#0f172a; padding:24px; }
  .wrap { max-width:1200px; margin:0 auto; }
  header { margin-bottom:20px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:22px; font-weight:700; }
  header .sub { font-size:13px; color:#64748b; }
  header a { margin-left:auto; font-size:13px; color:#64748b; text-decoration:none; }
  .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:14px; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:18px 20px; }
  .card .label { font-size:13px; color:#64748b; margin-bottom:6px; }
  .card .value { font-size:25px; font-weight:700; letter-spacing:-0.5px; }
  .card .value.big { font-size:31px; color:#2563eb; }
  .card .sub { font-size:12.5px; color:#64748b; margin-top:6px; }
  .card .sub strong { color:#0f172a; }
  .up { color:#16a34a !important; } .down { color:#dc2626 !important; }
  .progress { height:8px; background:#eff3f9; border-radius:4px; margin-top:10px; overflow:hidden; }
  .progress > div { height:100%; background:#2563eb; border-radius:4px; }
  .grid2 { display:grid; grid-template-columns:3fr 2fr; gap:14px; margin-bottom:14px; }
  .grid2b { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .panel { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:20px; }
  .panel h2 { font-size:15px; font-weight:600; margin-bottom:14px; }
  .panel h2 span { font-size:12px; font-weight:400; color:#94a3b8; margin-left:6px; }
  .rank-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .rank-no { width:20px; font-size:12.5px; color:#94a3b8; text-align:right; flex-shrink:0; font-weight:600; }
  .rank-name { width:96px; font-size:13.5px; color:#334155; flex-shrink:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rank-name small { color:#94a3b8; font-size:11px; margin-left:3px; }
  .rank-bar-area { flex:1; background:#eff3f9; border-radius:4px; height:20px; }
  .rank-bar { height:100%; background:#2563eb; border-radius:4px; }
  .rank-amt { width:72px; text-align:right; font-size:12.5px; font-weight:600; flex-shrink:0; }
  .src { font-size:11.5px; color:#94a3b8; margin-top:14px; line-height:1.6; }
  .err { background:#fff; border:1px solid #fca5a5; color:#b91c1c; border-radius:14px; padding:20px; font-size:14px; line-height:1.6; display:none; margin-bottom:14px; white-space:pre-wrap; word-break:break-all; }
  .loading { text-align:center; color:#94a3b8; padding:60px 0; font-size:14px; }
  svg text { font-family:'Pretendard',sans-serif; }
  @media (max-width:860px) {
    body { padding:14px; }
    .cards { grid-template-columns:repeat(2,1fr); }
    .grid2, .grid2b { grid-template-columns:1fr; }
    .card .value.big { font-size:25px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📈 영업 대시보드</h1>
    <span class="sub" id="updated"></span>
    <a href="../">← 전체 대시보드</a>
  </header>

  <div class="err" id="errBox"></div>
  <div class="loading" id="loading">데이터를 불러오는 중…</div>

  <div id="content" style="display:none">
    <div class="cards" id="cards"></div>

    <div class="grid2">
      <div class="panel">
        <h2>월별 매출 <span>세금계산서 공급가액 · 점선 = 목표</span></h2>
        <div id="barChart"></div>
      </div>
      <div class="panel">
        <h2>팀별 순수 매출 <span id="teamMonth"></span></h2>
        <div id="teamChart"></div>
      </div>
    </div>

    <div class="grid2b">
      <div class="panel">
        <h2>담당자 TOP 10 <span id="personMonth"></span></h2>
        <div id="personChart"></div>
      </div>
      <div class="panel">
        <h2>세금계산서 발행 건수 <span>월별</span></h2>
        <div id="countChart"></div>
      </div>
    </div>

    <div class="src">
      출처: 국세청 전자세금계산서(클로브 수집, 공급가액·부가세 제외) · AD CREW ERP (계약/유저 랭킹)<br>
      순수 매출 = 상품가격·부가세 제외 마진 기준 (AD CREW 유저 랭킹 집계)
    </div>
  </div>
</div>

<script>
const { createClient } = supabase;
const db = createClient(
  'https://ngqjcxjojskvglburgoc.supabase.co',
  'sb_publishable_DB_a5tbS3nFQtukwe8NqPA_L5ACxV4x'
);
const fmt = n => n.toLocaleString('ko-KR');
const eokM = n => (n / 10000).toFixed(n >= 100000 ? 1 : 2);   // 만원 → 억
const eokW = n => (n / 100000000).toFixed(2);                  // 원 → 억
const manW = n => Math.round(n / 10000).toLocaleString('ko-KR'); // 원 → 만원

async function main() {
  const [m, e, t, p] = await Promise.all([
    db.from('sales_monthly').select('*').order('sort_order', { ascending: true }),
    db.from('sales_erp_summary').select('*').order('id', { ascending: false }),
    db.from('sales_team').select('*').order('revenue', { ascending: false }),
    db.from('sales_person').select('*').order('rank', { ascending: true })
  ]);
  for (const res of [m, e, t, p]) if (res.error) throw res.error;
  const monthly = m.data;
  const cur = monthly[monthly.length - 1], prev = monthly[monthly.length - 2];
  const erp = e.data[0];
  const lastMonth = erp ? erp.month : cur.month;
  const teams = t.data.filter(x => x.month === lastMonth);
  const persons = p.data.filter(x => x.month === lastMonth)
    .sort((a, b) => b.revenue - a.revenue).slice(0, 10);
  const pureTotal = teams.reduce((a, x) => a + x.revenue, 0);

  const rate = cur.revenue / cur.target * 100;
  const remain = cur.target - cur.revenue;
  const revDiff = (cur.revenue - prev.revenue) / prev.revenue * 100;

  // ---- 카드 4개 ----
  document.getElementById('cards').innerHTML = `
    <div class="card">
      <div class="label">이번 달 매출 · 세금계산서 (${cur.month})</div>
      <div class="value big">${eokM(cur.revenue)}<span style="font-size:16px">억</span></div>
      <div class="progress"><div style="width:${Math.min(rate,100)}%"></div></div>
      <div class="sub">목표 ${eokM(cur.target)}억 대비 <strong>${rate.toFixed(1)}%</strong>
        ${remain <= 0 ? '<strong class="up">초과 달성 🎉</strong>' : ''}</div>
    </div>
    <div class="card">
      <div class="label">ERP 계약 매출 (${lastMonth}, VAT 제외)</div>
      <div class="value">${erp ? eokW(erp.gross) : '-'}<span style="font-size:15px">억</span></div>
      <div class="sub">리셀러 매출 별도 <strong>${erp ? eokW(erp.reseller) : '-'}억</strong></div>
    </div>
    <div class="card">
      <div class="label">순수 매출 · 마진 (${lastMonth})</div>
      <div class="value">${eokW(pureTotal)}<span style="font-size:15px">억</span></div>
      <div class="sub">영업 ${persons.length ? p.data.filter(x=>x.month===lastMonth).length : 0}명 · 팀 ${teams.length}개</div>
    </div>
    <div class="card">
      <div class="label">정산 예정 인센티브 (${lastMonth})</div>
      <div class="value">${erp ? eokW(erp.incentive) : '-'}<span style="font-size:15px">억</span></div>
      <div class="sub">부가세·원천징수 3.3% 제외 기준</div>
    </div>`;

  // ---- 월별 매출 막대 ----
  const W = 560, H = 250, padL = 44, padB = 30, padT = 20;
  const cw = W - padL - 14, chH = H - padT - padB;
  const maxV = Math.max(...monthly.map(d => Math.max(d.revenue, d.target))) * 1.15;
  const bw = cw / monthly.length * 0.55;
  let bars = '', labels = '', gridLines = '';
  for (let i = 0; i <= 4; i++) {
    const v = maxV / 4 * i, y = padT + chH - (v / maxV * chH);
    gridLines += `<line x1="${padL}" y1="${y}" x2="${W-14}" y2="${y}" stroke="#eef2f7"/>
      <text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#94a3b8">${(v/10000).toFixed(0)}억</text>`;
  }
  monthly.forEach((d, i) => {
    const cx = padL + cw / monthly.length * (i + 0.5);
    const h = d.revenue / maxV * chH, y = padT + chH - h;
    const isCur = i === monthly.length - 1;
    bars += `<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${isCur?'#2563eb':'#bfd3f7'}"/>
      <text x="${cx}" y="${y-6}" text-anchor="middle" font-size="11" fill="${isCur?'#2563eb':'#94a3b8'}" font-weight="${isCur?700:400}">${eokM(d.revenue)}</text>`;
    labels += `<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="12" fill="${isCur?'#0f172a':'#64748b'}" font-weight="${isCur?600:400}">${d.month}</text>`;
  });
  const ty = padT + chH - (cur.target / maxV * chH);
  document.getElementById('barChart').innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
      ${gridLines}${bars}
      <line x1="${padL}" y1="${ty}" x2="${W-14}" y2="${ty}" stroke="#64748b" stroke-dasharray="5 4" stroke-width="1.5"/>
      <text x="${padL+4}" y="${ty-6}" text-anchor="start" font-size="11" fill="#64748b">목표 ${(cur.target/10000).toFixed(0)}억</text>
      ${labels}
    </svg>`;

  // ---- 팀별 순수 매출 ----
  document.getElementById('teamMonth').textContent = lastMonth + ' · 만원';
  const maxT = Math.max(...teams.map(x => x.revenue));
  document.getElementById('teamChart').innerHTML = teams.map(x => `
    <div class="rank-row">
      <div class="rank-name" style="width:76px">${x.team}</div>
      <div class="rank-bar-area"><div class="rank-bar" style="width:${x.revenue/maxT*100}%"></div></div>
      <div class="rank-amt">${manW(x.revenue)}</div>
    </div>`).join('') +
    `<div style="font-size:12px;color:#94a3b8;margin-top:8px;text-align:right">합계 ${manW(pureTotal)}만원</div>`;

  // ---- 담당자 TOP 10 ----
  document.getElementById('personMonth').textContent = lastMonth + ' 순수 매출 · 만원';
  const maxP = Math.max(...persons.map(x => x.revenue));
  document.getElementById('personChart').innerHTML = persons.map((x, i) => `
    <div class="rank-row">
      <div class="rank-no">${i+1}</div>
      <div class="rank-name">${x.name}<small>${x.team}</small></div>
      <div class="rank-bar-area"><div class="rank-bar" style="width:${x.revenue/maxP*100}%"></div></div>
      <div class="rank-amt">${manW(x.revenue)}</div>
    </div>`).join('');

  // ---- 발행 건수 ----
  const W2 = 420, H2 = 250, padL2 = 14;
  const cw2 = W2 - padL2 - 14, chH2 = H2 - padT - padB;
  const maxC = Math.max(...monthly.map(d => d.invoice_count)) * 1.2;
  const bw2 = cw2 / monthly.length * 0.55;
  let bars2 = '';
  monthly.forEach((d, i) => {
    const cx = padL2 + cw2 / monthly.length * (i + 0.5);
    const h = d.invoice_count / maxC * chH2, y = padT + chH2 - h;
    const isCur = i === monthly.length - 1;
    bars2 += `<rect x="${cx-bw2/2}" y="${y}" width="${bw2}" height="${h}" rx="4" fill="${isCur?'#2563eb':'#bfd3f7'}"/>
      <text x="${cx}" y="${y-6}" text-anchor="middle" font-size="10.5" fill="${isCur?'#2563eb':'#94a3b8'}" font-weight="${isCur?700:400}">${fmt(d.invoice_count)}</text>
      <text x="${cx}" y="${H2-8}" text-anchor="middle" font-size="11.5" fill="${isCur?'#0f172a':'#64748b'}" font-weight="${isCur?600:400}">${d.month}</text>`;
  });
  document.getElementById('countChart').innerHTML =
    `<svg viewBox="0 0 ${W2} ${H2}" style="width:100%;height:auto">${bars2}</svg>`;

  document.getElementById('updated').textContent =
    new Date().toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' }) + ' 기준';
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}
main().catch(e => {
  document.getElementById('loading').style.display = 'none';
  const box = document.getElementById('errBox');
  box.style.display = 'block';
  box.textContent = '데이터를 불러오지 못했습니다.\n\n오류 내용: ' + (e.message || JSON.stringify(e)) +
    '\n\n이 화면을 그대로 캡처해서 Claude에게 보여주세요.';
});
</script>
</body>
</html>
