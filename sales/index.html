<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영업 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard', -apple-system, sans-serif;
    background: #f8fafc;
    color: #0f172a;
    padding: 24px;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }
  header { margin-bottom: 20px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 22px; font-weight: 700; }
  header .sub { font-size: 13px; color: #64748b; }

  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 14px; }
  .card {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
    padding: 18px 20px;
  }
  .card .label { font-size: 13px; color: #64748b; margin-bottom: 6px; }
  .card .value { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .card .value.big { font-size: 32px; color: #2563eb; }
  .card .sub { font-size: 12.5px; color: #64748b; margin-top: 6px; }
  .card .sub strong { color: #0f172a; }
  .progress { height: 8px; background: #eff3f9; border-radius: 4px; margin-top: 10px; overflow: hidden; }
  .progress > div { height: 100%; background: #2563eb; border-radius: 4px; }

  .grid2 { display: grid; grid-template-columns: 3fr 2fr; gap: 14px; margin-bottom: 14px; }
  .grid2b { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .panel {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 20px;
  }
  .panel h2 { font-size: 15px; font-weight: 600; margin-bottom: 14px; }
  .panel h2 span { font-size: 12px; font-weight: 400; color: #94a3b8; margin-left: 6px; }

  /* 깔때기 */
  .funnel-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .funnel-stage { width: 44px; font-size: 13px; color: #475569; flex-shrink: 0; }
  .funnel-bar-area { flex: 1; }
  .funnel-bar {
    height: 30px; background: #2563eb; border-radius: 4px;
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 8px; color: #fff; font-size: 12.5px; font-weight: 600;
    min-width: 52px;
  }
  .funnel-conv { font-size: 12px; color: #94a3b8; margin: 3px 0 3px 54px; }
  .funnel-total {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid #eef2f7;
    font-size: 13px; color: #475569;
  }
  .funnel-total strong { color: #2563eb; font-size: 16px; }

  /* 순위 */
  .rank-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .rank-name { width: 112px; font-size: 13.5px; color: #334155; flex-shrink: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank-bar-area { flex: 1; background: #eff3f9; border-radius: 4px; height: 22px; }
  .rank-bar { height: 100%; background: #2563eb; border-radius: 4px; }
  .rank-amt { width: 74px; text-align: right; font-size: 13px; font-weight: 600; color: #0f172a; flex-shrink: 0; }

  .err {
    background: #fff; border: 1px solid #fca5a5; color: #b91c1c;
    border-radius: 14px; padding: 20px; font-size: 14px; line-height: 1.6;
    display: none; margin-bottom: 14px; white-space: pre-wrap; word-break: break-all;
  }
  .loading { text-align: center; color: #94a3b8; padding: 60px 0; font-size: 14px; }

  svg text { font-family: 'Pretendard', sans-serif; }

  @media (max-width: 860px) {
    body { padding: 14px; }
    .cards { grid-template-columns: repeat(2, 1fr); }
    .grid2, .grid2b { grid-template-columns: 1fr; }
    .card .value.big { font-size: 26px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📊 영업 대시보드</h1>
    <span class="sub" id="updated"></span>
    <a href="../" style="margin-left:auto;font-size:13px;color:#64748b;text-decoration:none">← 전체 대시보드</a>
  </header>

  <div class="err" id="errBox"></div>
  <div class="loading" id="loading">데이터를 불러오는 중…</div>

  <div id="content" style="display:none">
    <div class="cards" id="cards"></div>

    <div class="grid2">
      <div class="panel">
        <h2>월별 매출 <span>점선 = 목표</span></h2>
        <div id="barChart"></div>
      </div>
      <div class="panel">
        <h2>영업 단계 깔때기</h2>
        <div id="funnel"></div>
      </div>
    </div>

    <div class="grid2b">
      <div class="panel">
        <h2>담당자별 순위 <span>만원</span></h2>
        <div id="rankPerson"></div>
      </div>
      <div class="panel">
        <h2>상품별 순위 <span>만원</span></h2>
        <div id="rankProduct"></div>
      </div>
    </div>
  </div>
</div>

<script>
const { createClient } = supabase;
const db = createClient(
  'https://ngqjcxjojskvglburgoc.supabase.co',
  'sb_publishable_DB_a5tbS3nFQtukwe8NqPA_L5ACxV4x'
);

const fmt = n => n.toLocaleString('ko-KR');

async function main() {
  const [m, p, r] = await Promise.all([
    db.from('sales_monthly').select('*').order('sort_order', { ascending: true }),
    db.from('sales_pipeline').select('*').order('sort_order', { ascending: true }),
    db.from('sales_rank').select('*').order('amount', { ascending: false })
  ]);
  for (const res of [m, p, r]) if (res.error) throw res.error;

  const monthly = m.data, pipeline = p.data, rank = r.data;
  const cur = monthly[monthly.length - 1];
  const deals = pipeline[pipeline.length - 1].count;

  // ---- 카드 4개 ----
  const rate = cur.revenue / cur.target * 100;
  const remain = cur.target - cur.revenue;
  const avgDeal = cur.revenue / deals;
  document.getElementById('cards').innerHTML = `
    <div class="card">
      <div class="label">이번 달 매출 (${cur.month})</div>
      <div class="value big">${fmt(cur.revenue)}<span style="font-size:16px">만원</span></div>
      <div class="progress"><div style="width:${Math.min(rate,100)}%"></div></div>
      <div class="sub">목표 대비 <strong>${rate.toFixed(1)}%</strong> 달성</div>
    </div>
    <div class="card">
      <div class="label">이번 달 목표</div>
      <div class="value">${fmt(cur.target)}<span style="font-size:15px">만원</span></div>
      <div class="sub">남은 금액 <strong>${fmt(remain)}만원</strong></div>
    </div>
    <div class="card">
      <div class="label">객단가</div>
      <div class="value">${avgDeal.toFixed(1)}<span style="font-size:15px">만원</span></div>
      <div class="sub">매출 ÷ 계약 ${fmt(deals)}건</div>
    </div>
    <div class="card">
      <div class="label">계약 건수</div>
      <div class="value">${fmt(deals)}<span style="font-size:15px">건</span></div>
      <div class="sub">파이프라인 최종 단계</div>
    </div>`;

  // ---- 월별 매출 막대 (SVG) ----
  const W = 560, H = 260, padL = 46, padB = 30, padT = 16;
  const chartW = W - padL - 12, chartH = H - padT - padB;
  const maxV = Math.max(...monthly.map(d => Math.max(d.revenue, d.target))) * 1.15;
  const bw = chartW / monthly.length * 0.55;
  let bars = '', labels = '', gridLines = '';

  for (let i = 0; i <= 4; i++) {
    const v = maxV / 4 * i;
    const y = padT + chartH - (v / maxV * chartH);
    gridLines += `<line x1="${padL}" y1="${y}" x2="${W-12}" y2="${y}" stroke="#eef2f7"/>
      <text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#94a3b8">${fmt(Math.round(v))}</text>`;
  }
  monthly.forEach((d, i) => {
    const cx = padL + chartW / monthly.length * (i + 0.5);
    const h = d.revenue / maxV * chartH;
    const y = padT + chartH - h;
    const isCur = i === monthly.length - 1;
    bars += `<rect x="${cx - bw/2}" y="${y}" width="${bw}" height="${h}" rx="4"
      fill="${isCur ? '#2563eb' : '#bfd3f7'}"/>
      <text x="${cx}" y="${y-6}" text-anchor="middle" font-size="11"
        fill="${isCur ? '#2563eb' : '#94a3b8'}" font-weight="${isCur ? 700 : 400}">${fmt(d.revenue)}</text>`;
    labels += `<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="12"
      fill="${isCur ? '#0f172a' : '#64748b'}" font-weight="${isCur ? 600 : 400}">${d.month}</text>`;
  });
  const ty = padT + chartH - (cur.target / maxV * chartH);
  document.getElementById('barChart').innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
      ${gridLines}${bars}
      <line x1="${padL}" y1="${ty}" x2="${W-12}" y2="${ty}" stroke="#64748b" stroke-dasharray="5 4" stroke-width="1.5"/>
      <text x="${W-14}" y="${ty-6}" text-anchor="end" font-size="11" fill="#64748b">목표 ${fmt(cur.target)}</text>
      ${labels}
    </svg>`;

  // ---- 깔때기 ----
  const maxCnt = pipeline[0].count;
  let fh = '';
  pipeline.forEach((s, i) => {
    const w = Math.max(s.count / maxCnt * 100, 14);
    fh += `<div class="funnel-row">
      <div class="funnel-stage">${s.stage}</div>
      <div class="funnel-bar-area"><div class="funnel-bar" style="width:${w}%">${fmt(s.count)}</div></div>
    </div>`;
    if (i < pipeline.length - 1) {
      const conv = pipeline[i+1].count / s.count * 100;
      fh += `<div class="funnel-conv">↓ 전환율 ${conv.toFixed(1)}%</div>`;
    }
  });
  const finalConv = pipeline[pipeline.length-1].count / pipeline[0].count * 100;
  fh += `<div class="funnel-total">최종 전환율 (${pipeline[pipeline.length-1].stage} ÷ ${pipeline[0].stage}) : <strong>${finalConv.toFixed(1)}%</strong></div>`;
  document.getElementById('funnel').innerHTML = fh;

  // ---- 순위 ----
  const renderRank = (kind, elId) => {
    const items = rank.filter(x => x.kind === kind);
    const maxA = Math.max(...items.map(x => x.amount));
    document.getElementById(elId).innerHTML = items.map(x => `
      <div class="rank-row">
        <div class="rank-name">${x.name}</div>
        <div class="rank-bar-area"><div class="rank-bar" style="width:${x.amount/maxA*100}%"></div></div>
        <div class="rank-amt">${fmt(x.amount)}</div>
      </div>`).join('');
  };
  renderRank('person', 'rankPerson');
  renderRank('product', 'rankProduct');

  document.getElementById('updated').textContent =
    new Date().toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' }) + ' 기준';
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

main().catch(e => {
  document.getElementById('loading').style.display = 'none';
  const box = document.getElementById('errBox');
  box.style.display = 'block';
  box.textContent = '데이터를 불러오지 못했습니다.\n\n오류 내용: ' + (e.message || JSON.stringify(e)) +
    '\n\n이 화면을 그대로 캡처해서 Claude에게 보여주세요.';
});
</script>
</body>
</html>
