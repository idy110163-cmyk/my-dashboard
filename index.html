<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회사 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Pretendard',-apple-system,sans-serif; background:#f8fafc; color:#0f172a;
    padding:40px 24px; min-height:100vh; }
  .wrap { max-width:980px; margin:0 auto; }
  h1 { font-size:26px; font-weight:700; margin-bottom:8px; }
  .sub { font-size:14px; color:#64748b; margin-bottom:32px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  a.card { background:#fff; border:1px solid #e2e8f0; border-radius:16px; overflow:hidden;
    text-decoration:none; color:inherit; transition:transform .15s, box-shadow .15s; display:block; }
  a.card:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(15,23,42,.08); }
  .stripe { height:6px; }
  .body { padding:20px 22px; }
  .emoji { font-size:26px; margin-bottom:10px; }
  .name { font-size:17px; font-weight:700; margin-bottom:5px; }
  .desc { font-size:13px; color:#64748b; line-height:1.5; }
  @media (max-width:820px) { .grid { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px) { .grid { grid-template-columns:1fr; } body { padding:24px 16px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 회사 대시보드</h1>
  <div class="sub">보고 싶은 영역을 선택하세요. 숫자는 데이터를 고치면 자동으로 반영됩니다.</div>
  <div class="grid">
    <a class="card" href="./exec/">
      <div class="stripe" style="background:linear-gradient(90deg,#2563eb,#ea580c,#0d9488,#16a34a,#7c3aed)"></div>
      <div class="body"><div class="emoji">🏢</div><div class="name">경영 종합</div>
      <div class="desc">전 영역 신호등 요약 — 30초 안에 상태 파악</div></div>
    </a>
    <a class="card" href="./sales/">
      <div class="stripe" style="background:#2563eb"></div>
      <div class="body"><div class="emoji">📈</div><div class="name">영업</div>
      <div class="desc">월별 매출, 목표 달성률, 파이프라인 전환율</div></div>
    </a>
    <a class="card" href="./marketing/">
      <div class="stripe" style="background:#ea580c"></div>
      <div class="body"><div class="emoji">📣</div><div class="name">마케팅</div>
      <div class="desc">채널별 ROAS·CAC, 예산 소진 페이싱</div></div>
    </a>
    <a class="card" href="./customer/">
      <div class="stripe" style="background:#0d9488"></div>
      <div class="body"><div class="emoji">👥</div><div class="name">고객</div>
      <div class="desc">코호트 잔존율, 재구매율, 이탈률, LTV</div></div>
    </a>
    <a class="card" href="./pl/">
      <div class="stripe" style="background:#16a34a"></div>
      <div class="body"><div class="emoji">💰</div><div class="name">손익</div>
      <div class="desc">영업이익 폭포 그래프, 손익분기, 비용 구조</div></div>
    </a>
    <a class="card" href="./hr/">
      <div class="stripe" style="background:#7c3aed"></div>
      <div class="body"><div class="emoji">🧑‍💼</div><div class="name">인사</div>
      <div class="desc">재직 인원, 인건비 비중, 이직률, 초과근무</div></div>
    </a>
  </div>
</div>
</body>
</html>
