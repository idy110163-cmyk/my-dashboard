<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인사 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Pretendard',-apple-system,sans-serif; background:#f8fafc; color:#0f172a; padding:24px; }
  .wrap { max-width:1200px; margin:0 auto; }
  header { margin-bottom:20px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:22px; font-weight:700; }
  header .sub { font-size:13px; color:#64748b; }
  header a { margin-left:auto; font-size:13px; color:#64748b; text-decoration:none; }
  .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:14px; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:18px 20px; }
  .card .label { font-size:13px; color:#64748b; margin-bottom:6px; }
  .card .value { font-size:26px; font-weight:700; letter-spacing:-0.5px; }
  .card .value.big { font-size:32px; color:#7c3aed; }
  .card .sub { font-size:12.5px; color:#64748b; margin-top:6px; }
  .card .sub strong { color:#0f172a; }
  .ok { color:#16a34a !important; } .warn { color:#dc2626 !important; }
  .grid2 { display:grid; grid-template-columns:3fr 2fr; gap:14px; margin-bottom:14px; }
  .grid2b { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .panel { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:20px; }
  .panel h2 { font-size:15px; font-weight:600; margin-bottom:14px; }
  .panel h2 span { font-size:12px; font-weight:400; color:#94a3b8; margin-left:6px; }
  .legend { display:flex; flex-direction:column; gap:8px; font-size:13px; margin-top:6px; }
  .legend .li { display:flex; align-items:center; gap:8px; color:#475569; }
  .legend .dot { width:10px; height:10px; border-radius:3px; flex-shrink:0; }
  table.dept { width:100%; border-collapse:collapse; font-size:13.5px; }
  table.dept th { text-align:left; color:#64748b; font-weight:500; padding:8px 6px; border-bottom:1px solid #e2e8f0; }
  table.dept td { padding:10px 6px; border-bottom:1px solid #f1f5f9; vertical-align:middle; }
  table.dept td:last-child, table.dept th:last-child, table.dept td:nth-child(3), table.dept th:nth-child(3) { text-align:right; }
  .dbar { background:#f1e9fd; border-radius:4px; height:16px; width:100%; }
  .dbar > div { height:100%; background:#7c3aed; border-radius:4px; }
  table.ot { width:100%; border-collapse:separate; border-spacing:3px; font-size:12.5px; }
  table.ot th { color:#64748b; font-weight:500; padding:5px; text-align:center; }
  table.ot th:first-child { text-align:left; }
  table.ot td { text-align:center; padding:9px 4px; border-radius:6px; font-weight:600; }
  table.ot td.d { text-align:left; font-weight:500; color:#475569; }
  .err { background:#fff; border:1px solid #fca5a5; color:#b91c1c; border-radius:14px; padding:20px; font-size:14px; line-height:1.6; display:none; margin-bottom:14px; white-space:pre-wrap; word-break:break-all; }
  .loading { text-align:center; color:#94a3b8; padding:60px 0; font-size:14px; }
  svg text { font-family:'Pretendard',sans-serif; }
  @media (max-width:860px) {
    body { padding:14px; }
    .cards { grid-template-columns:repeat(2,1fr); }
    .grid2, .grid2b { grid-template-columns:1fr; }
    .card .value.big { font-size:26px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧑‍💼 인사 대시보드</h1>
    <span class="sub" id="updated"></span>
    <a href="../">← 전체 대시보드</a>
  </header>

  <div class="err" id="errBox"></div>
  <div class="loading" id="loading">데이터를 불러오는 중…</div>

  <div id="content" style="display:none">
    <div class="cards" id="cards"></div>

    <div class="grid2">
      <div class="panel">
        <h2>월별 재직 인원</h2>
        <div id="headChart"></div>
      </div>
      <div class="panel">
        <h2>근속 분포</h2>
        <div id="tenure"></div>
      </div>
    </div>

    <div class="grid2b" style="margin-top:14px">
      <div class="panel">
        <h2>부서별 인건비 <span>만원</span></h2>
        <div id="deptTable"></div>
      </div>
      <div class="panel">
        <h2>부서별 초과근무 분포 <span>인원수</span></h2>
        <div id="otTable"></div>
      </div>
    </div>
  </div>
</div>

<script>
const { createClient } = supabase;
const db = createClient(
  'https://ngqjcxjojskvglburgoc.supabase.co',
  'sb_publishable_DB_a5tbS3nFQtukwe8NqPA_L5ACxV4x'
);
const fmt = n => n.toLocaleString('ko-KR');
const PAYROLL_LIMIT = 35, TURNOVER_TARGET = 12;
const OT_BUCKETS = ['0h','1-10','11-20','21-30','30h+'];

async function main() {
  const [m, d, t, o] = await Promise.all([
    db.from('hr_monthly').select('*').order('sort_order', { ascending: true }),
    db.from('hr_dept').select('*').order('payroll', { ascending: false }),
    db.from('hr_tenure').select('*').order('sort_order', { ascending: true }),
    db.from('hr_overtime').select('*')
  ]);
  for (const res of [m, d, t, o]) if (res.error) throw res.error;
  const monthly = m.data, dept = d.data, tenure = t.data, ot = o.data;
  const cur = monthly[monthly.length-1], prev = monthly[monthly.length-2];

  const payRatio = cur.payroll / cur.revenue * 100;
  const totalLeft = monthly.reduce((a,x)=>a+x.left_count,0);
  const avgHead = monthly.reduce((a,x)=>a+x.headcount,0) / monthly.length;
  const turnover = totalLeft / avgHead * 100;
  const revPer = cur.revenue / cur.headcount;
  const revPerPrev = prev.revenue / prev.headcount;
  const revPerDiff = revPer - revPerPrev;

  // ---- 카드 ----
  document.getElementById('cards').innerHTML = `
    <div class="card">
      <div class="label">재직 인원 (${cur.month})</div>
      <div class="value big">${cur.headcount}<span style="font-size:16px">명</span></div>
      <div class="sub">이번 달 입사 <strong>+${cur.joined}</strong> · 퇴사 <strong>-${cur.left_count}</strong></div>
    </div>
    <div class="card">
      <div class="label">인건비 비중</div>
      <div class="value">${payRatio.toFixed(1)}<span style="font-size:15px">%</span></div>
      <div class="sub">기준 ${PAYROLL_LIMIT}% <strong class="${payRatio <= PAYROLL_LIMIT ? 'ok' : 'warn'}">${payRatio <= PAYROLL_LIMIT ? '이하 ✓' : '초과 ⚠'}</strong></div>
    </div>
    <div class="card">
      <div class="label">이직률 (최근 ${monthly.length}개월)</div>
      <div class="value">${turnover.toFixed(1)}<span style="font-size:15px">%</span></div>
      <div class="sub">목표 ${TURNOVER_TARGET}% <strong class="${turnover <= TURNOVER_TARGET ? 'ok' : 'warn'}">${turnover <= TURNOVER_TARGET ? '이내 ✓' : '초과 ⚠'}</strong></div>
    </div>
    <div class="card">
      <div class="label">1인당 매출</div>
      <div class="value">${revPer.toFixed(0)}<span style="font-size:15px">만원</span></div>
      <div class="sub">전월 대비 <strong class="${revPerDiff >= 0 ? 'ok' : 'warn'}">${revPerDiff >= 0 ? '+' : ''}${revPerDiff.toFixed(0)}만원</strong></div>
    </div>`;

  // ---- 월별 인원 막대 ----
  const W = 560, H = 250, padL = 36, padB = 30, padT = 20;
  const cw = W - padL - 14, chH = H - padT - padB;
  const maxH = Math.max(...monthly.map(x=>x.headcount)) * 1.25;
  const bw = cw / monthly.length * 0.55;
  let bars = '';
  monthly.forEach((x, i) => {
    const cx = padL + cw/monthly.length*(i+0.5);
    const h = x.headcount/maxH*chH, y = padT + chH - h;
    const isCur = i === monthly.length-1;
    bars += `<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${isCur?'#7c3aed':'#d8c8f7'}"/>
      <text x="${cx}" y="${y-7}" text-anchor="middle" font-size="12" font-weight="${isCur?700:400}" fill="${isCur?'#7c3aed':'#94a3b8'}">${x.headcount}명</text>
      <text x="${cx}" y="${H-8}" text-anchor="middle" font-size="12" fill="${isCur?'#0f172a':'#64748b'}" font-weight="${isCur?600:400}">${x.month}</text>`;
  });
  document.getElementById('headChart').innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${bars}</svg>`;

  // ---- 근속 도넛 ----
  const cols = ['#7c3aed', '#a78bfa', '#d8c8f7', '#eee7fc'];
  const totalT = tenure.reduce((a,x)=>a+x.count,0);
  const R = 54, C = 2*Math.PI*R;
  let off = 0, circles = '';
  tenure.forEach((x, i) => {
    const len = x.count/totalT*C;
    circles += `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${cols[i%cols.length]}" stroke-width="22"
      stroke-dasharray="${(len-2).toFixed(1)} ${(C-len+2).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}"
      transform="rotate(-90 70 70)"/>`;
    off += len;
  });
  document.getElementById('tenure').innerHTML = `
    <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
      <svg viewBox="0 0 140 140" style="width:150px;height:150px;flex-shrink:0">
        ${circles}
        <text x="70" y="66" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">${totalT}명</text>
        <text x="70" y="84" text-anchor="middle" font-size="11" fill="#64748b">총 인원</text>
      </svg>
      <div class="legend">
        ${tenure.map((x,i)=>`<div class="li"><div class="dot" style="background:${cols[i%cols.length]}"></div>${x.bucket} <b>${x.count}명</b> (${(x.count/totalT*100).toFixed(0)}%)</div>`).join('')}
        <div class="li" style="margin-top:6px;padding-top:8px;border-top:1px solid #eef2f7">이직률 <b>${turnover.toFixed(1)}%</b></div>
      </div>
    </div>`;

  // ---- 부서 표 ----
  const maxP = Math.max(...dept.map(x=>x.payroll));
  document.getElementById('deptTable').innerHTML = `
    <table class="dept">
      <tr><th>부서</th><th style="width:40%">인건비</th><th>금액</th><th>인원</th></tr>
      ${dept.map(x=>`<tr>
        <td>${x.dept}</td>
        <td><div class="dbar"><div style="width:${x.payroll/maxP*100}%"></div></div></td>
        <td><b>${fmt(x.payroll)}</b></td>
        <td>${x.headcount}명</td>
      </tr>`).join('')}
    </table>`;

  // ---- 초과근무 히트맵 ----
  const depts = [...new Set(ot.map(x=>x.dept))];
  const maxC = Math.max(...ot.map(x=>x.count));
  let head = '<tr><th>부서</th>' + OT_BUCKETS.map(b=>`<th>${b}</th>`).join('') + '</tr>';
  let rows = depts.map(dp => {
    let tds = `<td class="d">${dp}</td>`;
    OT_BUCKETS.forEach(b => {
      const cell = ot.find(x=>x.dept===dp && x.bucket===b);
      const v = cell ? cell.count : 0;
      const alpha = 0.06 + (v/maxC)*0.9;
      tds += `<td style="background:rgba(124,58,237,${alpha.toFixed(2)});color:${v/maxC>0.55?'#fff':'#0f172a'}">${v}</td>`;
    });
    return `<tr>${tds}</tr>`;
  }).join('');
  document.getElementById('otTable').innerHTML =
    `<table class="ot">${head}${rows}</table>
     <div style="font-size:11.5px;color:#94a3b8;margin-top:8px">월 초과근무 시간대별 인원 · 색이 진할수록 많음</div>`;

  document.getElementById('updated').textContent =
    new Date().toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' }) + ' 기준';
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}
main().catch(e => {
  document.getElementById('loading').style.display = 'none';
  const box = document.getElementById('errBox');
  box.style.display = 'block';
  box.textContent = '데이터를 불러오지 못했습니다.\n\n오류 내용: ' + (e.message || JSON.stringify(e)) +
    '\n\n이 화면을 그대로 캡처해서 Claude에게 보여주세요.';
});
</script>
</body>
</html>
